<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}405 Network — Property Analyzer{% endblock %}</title>
  <!-- OG tags -->
  {% block og_tags %}
  {% if r and inp %}
  <meta property="og:title" content="{{ params.get('property_url', '').split('/')[-1] if params.get('property_url') else '405 Network' }} — ${{ '{:,.0f}'.format(inp.purchase_price|int) }} · {{ inp.total_units }} Units">
  <meta property="og:description" content="Cap Rate: {{ '{:.1f}'.format(r.cap_rate|float) }}% | CoC: {{ '{:.1f}'.format(r.cash_on_cash|float) }}% | DSCR: {{ '{:.2f}'.format(r.dscr|float) }}x | {{ v.verdict }}">
  {% if params.get('image_url') %}
  <meta property="og:image" content="{{ params.get('image_url') }}">
  {% endif %}
  {% else %}
  <meta property="og:title" content="405 Network — Property Analyzer">
  <meta property="og:description" content="Investment screening tool for multifamily real estate">
  {% endif %}
  <meta property="og:type" content="website">
  {% endblock %}
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- HTMX -->
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script src="https://unpkg.com/htmx-ext-sse@2.2.2/sse.js"></script>
  <!-- App CSS -->
  <link rel="stylesheet" href="/static/css/theme.css">
  <link rel="icon" href="/static/favicon.png">
</head>
<body>
  {% block content %}{% endblock %}
  <script src="/static/js/theme.js"></script>
  <script src="/static/js/parse.js" defer></script>
</body>
</html>

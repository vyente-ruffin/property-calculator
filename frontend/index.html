<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Property Parser</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="header">
    <div class="header-left">
      <img src="/favicon.png" alt="Logo" class="logo">
      <h1>Property Parser</h1>
    </div>
    <nav class="header-nav">
      <a href="/" class="nav-link active">Parser</a>
      <a href="http://localhost:8501" target="_blank" class="nav-link">Calculator</a>
    </nav>
  </header>

  <main class="dashboard">
    <!-- Left Panel: Chat -->
    <section class="chat-panel">
      <div class="chat-messages" id="chatMessages">
        <div class="system-bubble">
          Paste a raw property listing below and click <strong>Parse Listing</strong> to extract structured data.
        </div>
      </div>
      <div class="chat-input-area">
        <textarea
          id="chatInput"
          placeholder="Paste a listing URL or raw listing text here... (optionally add URL as last line)"
          rows="5"
        ></textarea>
        <button id="parseBtn" onclick="submitListing()">Parse Listing</button>
      </div>
    </section>

    <!-- Right Panel: Results -->
    <section class="result-panel">
      <!-- Pipeline Steps -->
      <div class="pipeline-section" id="pipelineSection" style="display:none;">
        <h3 class="section-title">Pipeline Progress</h3>
        <div id="pipelineSteps"></div>
      </div>

      <!-- Property Card -->
      <div id="propertyCard" style="display:none;"></div>

      <!-- Empty State -->
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">&#127968;</div>
        <p>Parse a listing to see structured property data here.</p>
      </div>
    </section>
  </main>

  <script src="/js/steps.js"></script>
  <script src="/js/card.js"></script>
  <script src="/js/chat.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
